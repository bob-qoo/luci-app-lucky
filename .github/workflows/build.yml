name: Build packages

on:
  push:
    branches:
      - main
      - v3
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install static-check dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext lua5.1
      - name: Validate source files
        shell: bash
        run: |
          set -eu
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0
          "$(go env GOPATH)/bin/shfmt" -d -sr -s \
            lucky/files/lucky.init lucky/files/lucky-call lucky/files/lucky-watchdog scripts/build-sdk.sh
          sh -n lucky/files/lucky.init
          sh -n lucky/files/lucky-call
          sh -n lucky/files/lucky-watchdog
          bash -n scripts/build-sdk.sh
          node -e "const fs=require('fs'); for (const f of process.argv.slice(1)) JSON.parse(fs.readFileSync(f));" \
            luci-app-lucky/root/usr/share/luci/menu.d/luci-app-lucky.json \
            luci-app-lucky/root/usr/share/rpcd/acl.d/luci-app-lucky.json
          node -e "new Function(require('fs').readFileSync(process.argv[1], 'utf8'));" \
            luci-app-lucky/htdocs/luci-static/resources/view/lucky/config.js
          node --check luci-app-lucky/htdocs/luci-static/resources/view/lucky/legacy.js
          luac5.1 -p luci-app-lucky/root/usr/lib/lua/luci/lucky_legacy.lua
          node scripts/test-lucky-view.js
          lua5.1 scripts/test-lucky-controller.lua
          lua5.1 scripts/test-lucky-legacy.lua
          LUA_PATH='./luci-app-lucky/root/usr/lib/lua/?.lua;;' \
            lua5.1 scripts/test-lucky-diagnostics.lua --parse-only
          msgfmt --check --check-compatibility -o /dev/null luci-app-lucky/po/zh_Hans/lucky.po
          python3 scripts/check-po.py luci-app-lucky/po/zh_Hans/lucky.po \
            luci-app-lucky/htdocs/luci-static/resources/view/lucky/config.js \
            luci-app-lucky/htdocs/luci-static/resources/view/lucky/legacy.js \
            luci-app-lucky/root/usr/lib/lua/luci/view/lucky/legacy.htm
          python3 scripts/check-build-matrix.py scripts/build-matrix.json
          python3 scripts/test-lucky-i18n.py

  build:
    needs: static-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          # Fork scoped build: only 25.12 amd64 (x86_64) is needed for the
          # local OpenWrt migration. Other versions/architectures removed.
          - x86_64-25.12.5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with the official OpenWrt SDK action
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434 # main, pinned 2026-08-09
        env:
          ARCH: ${{ matrix.sdk }}
          BUILD_LOG: 1
          PACKAGES: lucky luci-app-lucky
      - name: Upload packages and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.sdk }}
          if-no-files-found: warn
          path: |
            bin/packages/**/*.ipk
            bin/packages/**/*.apk
            logs/**
